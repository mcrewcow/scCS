[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scCS-py"
version = "0.8.0"
description = "Supervised single-cell commitment scoring at manually annotated furcations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Emil Kriukov"}
]
keywords = ["single-cell", "RNA velocity", "commitment scores", "fate decision", "scRNA-seq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "anndata>=0.11",
    "scanpy>=1.11",
]

[project.urls]
Homepage = "https://github.com/mcrewcow/scCS"
Documentation = "https://sccs-py.readthedocs.io/"
Repository = "https://github.com/mcrewcow/scCS"
Issues = "https://github.com/mcrewcow/scCS/issues"
Changelog = "https://sccs-py.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
velocity = ["scvelo>=0.3.4"]
drivers = ["statsmodels>=0.14"]
enrichment = ["gseapy>=1.0"]
validation = ["scvelo>=0.3.4", "regvelo>=0.4.2"]
all = ["scvelo>=0.3.4", "statsmodels>=0.14", "gseapy>=1.0"]
docs = ["sphinx>=7", "sphinx-autoapi>=3", "furo", "nbsphinx", "ipykernel"]
dev = ["pytest", "pytest-cov", "black", "ruff", "build", "sphinx>=7", "sphinx-autoapi>=3", "furo", "nbsphinx", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scCS*"]

[tool.setuptools.package-data]
scCS = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
